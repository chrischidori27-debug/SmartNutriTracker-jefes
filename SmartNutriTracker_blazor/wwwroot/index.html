<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Sistema de seguimiento nutricional para estudiantes." />
    <title>NutriFit Estudiantil</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2322c55e'/%3E%3Cpath d='M7 25C7 14 13 8 25 7C25 19 19 25 7 25Z' fill='%23000'/%3E%3Cpath d='M7 25L18 14' stroke='%2322c55e' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --font-sans: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        @layer base {
            html {
                color-scheme: dark;
                background-color: #000;
            }

            body {
                margin: 0;
                min-height: 100vh;
                background-color: #000;
                color: #fff;
                font-family: var(--font-sans);
                -webkit-font-smoothing: antialiased;
            }

            button:not(:disabled),
            select,
            [type="radio"] + label {
                cursor: pointer;
            }

            :focus-visible {
                outline: 2px solid #4ade80;
                outline-offset: 2px;
            }

            ::selection {
                background-color: #22c55e;
                color: #000;
            }

            * {
                scrollbar-width: thin;
                scrollbar-color: #333 transparent;
            }
        }

        @keyframes aviso-entrada {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .aviso-entrada {
            animation: aviso-entrada 0.2s ease-out;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="grid min-h-screen place-items-center bg-black text-sm text-neutral-400">Cargando NutriFit…</div>
    </div>

    <div id="blazor-error-ui" class="hidden fixed inset-x-0 bottom-0 z-[1000] bg-yellow-200 px-5 py-3 text-sm text-black shadow-lg">
        Ha ocurrido un error inesperado.
        <a href="." class="reload ml-2 underline">Recargar</a>
        <span class="dismiss float-right cursor-pointer">🗙</span>
    </div>

    <script src="nutri.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
